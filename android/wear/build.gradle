apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace = "com.aera.app.wear"
    compileSdk = rootProject.ext.compileSdkVersion
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = "21"
    }
    defaultConfig {
        // MUST match the phone app id so the Wearable Data Layer pairs the two.
        applicationId "com.aera.app"
        minSdkVersion 30
        // Pin below 35: on Android 15+ the classic BODY_SENSORS runtime prompt is
        // ignored (body sensors moved under Health permissions), so Health Services
        // never gets granted. targetSdk 34 keeps the normal BODY_SENSORS dialog.
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.lifecycle:lifecycle-service:2.8.7'
    // Live HR without Samsung partnership (Wear OS 3+).
    implementation 'androidx.health:health-services-client:1.0.0'
    // Guava puts com.google.common.util.concurrent.ListenableFuture on the compile
    // classpath — Health Services' *Async calls return it.
    implementation 'com.google.guava:guava:33.3.1-android'
    // Wearable Data Layer to reach the phone.
    implementation 'com.google.android.gms:play-services-wearable:18.2.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    // Ongoing Activity for persistence.
    implementation 'androidx.wear:wear-ongoing:1.0.0'
    testImplementation 'junit:junit:4.13.2'
}
